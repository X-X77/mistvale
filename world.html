  <meta name="description" content="미스트베일 세계관을 둘러보는 인터랙티브 마을 안내. 마을 시설과 숲·해안·호수, 그곳의 인물들을 만나 보세요.">
  <link rel="icon" href="./assets/pickaxe-cursor.svg" type="image/svg+xml">
  <script>
  // 지도는 오프닝 첫 선택지 ②('마을을 살펴보러 간다')로만 열립니다. 직접 주소로 들어오면 스토어로 돌려보냅니다.
  // (제작 확인용: 주소 끝에 ?dev=1 을 붙이면 바로 열립니다.)
  try { if (!sessionStorage.getItem('mistvale.mapUnlocked') && !/[?&]dev=1/.test(location.search)) location.replace('./index.html#store'); } catch (error) { /* 저장소를 쓸 수 없으면 막지 않습니다 */ }
</script>
  <style>
    /* 집을 나서는 전환의 끝: 밝은 안개에서 지도로 서서히 드러납니다. */
    @keyframes mv-arrive { from { opacity: 0; filter: brightness(1.7) saturate(.7); } to { opacity: 1; filter: none; } }
    body.mv-world { animation: mv-arrive .9s ease-out both; }
    @media (prefers-reduced-motion: reduce) { body.mv-world { animation: none; } }
    html.mv-reduced-motion body.mv-world { animation: none; }
  </style>
  <link rel="stylesheet" href="./world.css">
  <link rel="stylesheet" href="./world-exploration.css">

</head>

    <div class="mv-map-bottom"><div><p class="mv-overline">둘러볼 수 있는 장소</p><p class="mv-map-hint">장소 표시를 선택해 안으로 들어가 보세요.</p></div><div id="place-list"><section id="place-group-town" aria-labelledby="town-label"><h2 id="town-label" class="mv-group-label">마을 시설</h2><div id="place-list-town" class="mv-place-grid"></div></section><section id="place-group-outside" aria-labelledby="outside-label"><h2 id="outside-label" class="mv-group-label">마을 밖 · 숲, 해안, 동굴, 호수</h2><div id="place-list-outside" class="mv-place-grid"></div></section></div></div>
  </section>

</dialog>
